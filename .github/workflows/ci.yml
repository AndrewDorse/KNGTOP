name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Pytest
        run: pytest -q

      - uses: docker/setup-buildx-action@v3

      - name: Docker build (with GitHub Actions cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: kngtop:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
